services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: grounded_rag_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grounded_rag}
      POSTGRES_USER: ${POSTGRES_USER:-grounded_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grounded_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
