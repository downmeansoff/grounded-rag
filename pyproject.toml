[project]
name = "grounded-rag"
version = "0.1.0"
description = "Grounded RAG engine on Postgres: hybrid search, cited answers, swappable domain profile."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "tqdm>=4.67",
    "gigachat>=0.1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E и F это базовые ошибки, I следит за порядком импортов, UP не даёт коду
# отставать от версии Python, B ловит настоящие ловушки вроде изменяемого
# значения по умолчанию.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Скрипты чинят кодировку вывода до импорта модулей проекта: импорт
# sentence-transformers печатает прогресс, и в консоли Windows он ломается
# раньше, чем дойдёт очередь до нашего кода.
"scripts/*" = ["E402"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
